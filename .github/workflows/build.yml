name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Persistent signing key => every build installs as an UPDATE (keeps app data + login).
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lNVhnVYM4VdgVsuWNSnk' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'oledtv' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lNVhnVYM4VdgVsuWNSnk' }}
      # versionCode = GITHUB_RUN_NUMBER (+ optional offset, set as a repo variable if needed)
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Select signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            # Persistent key committed to the repo (signing/release.keystore) so every build installs as an update.
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Lint and unit tests
        run: gradle lintDebug testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OLEDTV-Music-build${{ github.run_number }}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLEDTV-Music-build${{ github.run_number }}
          path: OLEDTV-Music-build${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: OLEDTV-Music-build${{ github.run_number }}.apk
          make_latest: true
          generate_release_notes: true
